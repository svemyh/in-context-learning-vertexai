inherit:
  - models/standard.yaml
  - wandb.yaml

model:
  family: gpt2
  n_dims:      1
  n_positions: 128
  n_embd:      256
  n_layer:     12
  n_head:      8

training:
  task: fourier_transform
  data: timefreq
  batch_size: 64
  learning_rate: 1e-4
  train_steps:   1000
  save_every_steps: 1000
  keep_every_steps: 100000
  curriculum:
    dims:
      start: 1
      end:   1
      inc:   1
      interval: 100
    points:
      start: 128
      end:   128
      inc:   0
      interval: 1

out_dir: ../models/linear_regression

wandb:
  name: "time_freq"
