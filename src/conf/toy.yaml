inherit:
  - models/standard.yaml
  - wandb.yaml

model:
  family: gpt2
  n_dims:      1
  n_positions: 128
  n_embd:      256
  n_layer:     12
  n_head:      8

training:
  task: fourier_transform       # make sure your schema’s “allowed” list includes this
  data: timefreq                # likewise, include “timefreq” in the schema’s allowed data values
  batch_size: 64
  learning_rate: 0.0001         # explicit YAML float (0.0001 instead of 1e-4)
  task_kwargs: {}               # must be present (even if empty) to satisfy “null not allowed”
  train_steps:   5000
  save_every_steps: 1000
  keep_every_steps: 100000
  curriculum:
    dims:
      start: 1
      end:   1
      inc:   1
      interval: 100
    points:
      start: 128
      end:   128
      inc:   0
      interval: 1

out_dir: ../models/fourier_transform

wandb:
  name: time_freq_transformer_with_baseline
